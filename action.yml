name: 'Boot Simulator'
description: 'Boot an iPhone or iPad simulator for GitHub Actions'
author: 'koji-1009'

inputs:
  device:
    description: 'Device family: iPhone or iPad (ignored when model is set)'
    required: false
    default: 'iPhone'
  os:
    description: 'iOS version (e.g. 26, 26.1, 26.1.1, >=26.1, >=26.0 <26.5)'
    required: false
    default: ''
  model:
    description: 'Exact model name (e.g. iPhone 17 Pro), takes precedence over device'
    required: false
    default: ''
  xcode-version:
    description: 'Xcode to select first, same syntax as os (sets DEVELOPER_DIR for the job)'
    required: false
    default: ''

branding:
  icon: 'smartphone'
  color: 'gray-dark'

runs:
  using: 'composite'
  steps:
    - shell: sh
      # Inputs arrive as environment variables, never as ${{ }} expanded into
      # the command, so a value cannot break out of it.
      env:
        INPUT_DEVICE: ${{ inputs.device }}
        INPUT_OS: ${{ inputs.os }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_XCODE: ${{ inputs.xcode-version }}
      run: |
        set -eu
        set -- boot --device "$INPUT_DEVICE"
        [ -z "$INPUT_XCODE" ] || set -- "$@" --xcode "$INPUT_XCODE"
        [ -z "$INPUT_OS" ]    || set -- "$@" --os "$INPUT_OS"
        [ -z "$INPUT_MODEL" ] || set -- "$@" --model "$INPUT_MODEL"
        "$GITHUB_ACTION_PATH/boot-simctl" "$@"
