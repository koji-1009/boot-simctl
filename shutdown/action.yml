name: 'Shut Down Simulator'
description: 'Shut down a simulator booted by boot-simctl'
author: 'koji-1009'

inputs:
  udid:
    description: 'UDID or name of the device to shut down'
    required: true

branding:
  icon: 'power'
  color: 'gray-dark'

runs:
  using: 'composite'
  steps:
    - shell: sh
      env:
        INPUT_UDID: ${{ inputs.udid }}
      run: |
        set -eu
        # This action lives one directory below the script it calls.
        "$GITHUB_ACTION_PATH/../boot-simctl" shutdown "$INPUT_UDID"
